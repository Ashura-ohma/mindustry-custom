name: Aurora Android
on:
  push:
    branches: [aurora-frontier]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned Arc source
        run: |
          git clone https://github.com/Anuken/Arc ../Arc
          git -C ../Arc checkout 8eb00ffff0126d0576c67df46f99b8f6bccd96fe
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build
        run: ./gradlew tests:test android:assembleDebug -Pbuildversion=160.5
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Frontier-debug-APK
          path: android/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-reports
          path: tests/build/reports/tests/test
